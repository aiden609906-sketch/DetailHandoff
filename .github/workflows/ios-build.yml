name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project DetailHandoff.xcodeproj
          -scheme DetailHandoff
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Select available iPhone and iPad simulators
        id: simulators
        shell: bash
        run: |
          set -euo pipefail
          devices_json="$(xcrun simctl list devices available --json)"
          phone_json="$(
            jq -c '
              [
                .devices
                | to_entries
                | map(select(.key | contains("SimRuntime.iOS-")))
                | sort_by(.key)
                | reverse
                | .[]
                | .key as $runtime
                | .value[]
                | select(.isAvailable == true and (.name | startswith("iPhone")))
                | {udid, name, runtime: $runtime}
              ]
              | first // empty
            ' <<< "$devices_json"
          )"
          pad_json="$(
            jq -c '
              [
                .devices
                | to_entries
                | map(select(.key | contains("SimRuntime.iOS-")))
                | sort_by(.key)
                | reverse
                | .[]
                | .key as $runtime
                | .value[]
                | select(.isAvailable == true and (.name | startswith("iPad")))
                | {udid, name, runtime: $runtime}
              ]
              | first // empty
            ' <<< "$devices_json"
          )"

          if [[ -z "$phone_json" || "$phone_json" == "null" || -z "$pad_json" || "$pad_json" == "null" ]]; then
            echo "::error::An available iPhone and iPad simulator are both required."
            xcrun simctl list devices available
            exit 1
          fi

          echo "phone_udid=$(jq -r '.udid' <<< "$phone_json")" >> "$GITHUB_OUTPUT"
          echo "phone_name=$(jq -r '.name' <<< "$phone_json")" >> "$GITHUB_OUTPUT"
          echo "phone_runtime=$(jq -r '.runtime' <<< "$phone_json")" >> "$GITHUB_OUTPUT"
          echo "pad_udid=$(jq -r '.udid' <<< "$pad_json")" >> "$GITHUB_OUTPUT"
          echo "pad_name=$(jq -r '.name' <<< "$pad_json")" >> "$GITHUB_OUTPUT"
          echo "pad_runtime=$(jq -r '.runtime' <<< "$pad_json")" >> "$GITHUB_OUTPUT"
      - name: Record selected simulator inventory
        run: |
          {
            echo "iPhone: ${{ steps.simulators.outputs.phone_name }} (${{ steps.simulators.outputs.phone_runtime }})"
            echo "iPad: ${{ steps.simulators.outputs.pad_name }} (${{ steps.simulators.outputs.pad_runtime }})"
          } | tee SimulatorInventory.txt
      - name: Select available iPhone simulator for unit tests
        id: simulator
        run: |
          echo "udid=${{ steps.simulators.outputs.phone_udid }}" >> "$GITHUB_OUTPUT"
      - name: Run full iOS unit-test target
        run: >-
          xcodebuild
          test
          -project DetailHandoff.xcodeproj
          -scheme DetailHandoff
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -only-testing:DetailHandoffTests
          -resultBundlePath UnitTestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Run UI tests on selected iPhone
        run: >-
          xcodebuild
          test
          -project DetailHandoff.xcodeproj
          -scheme DetailHandoff
          -destination 'platform=iOS Simulator,id=${{ steps.simulators.outputs.phone_udid }}'
          -only-testing:DetailHandoffUITests
          -resultBundlePath UITestResults-iPhone.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Run UI tests on selected iPad
        if: always()
        run: >-
          xcodebuild
          test
          -project DetailHandoff.xcodeproj
          -scheme DetailHandoff
          -destination 'platform=iOS Simulator,id=${{ steps.simulators.outputs.pad_udid }}'
          -only-testing:DetailHandoffUITests
          -resultBundlePath UITestResults-iPad.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Export test attachments for visual inspection
        if: always()
        run: |
          set -euo pipefail
          for result in UITestResults-iPhone.xcresult UITestResults-iPad.xcresult; do
            if [[ -f "$result/Info.plist" ]]; then
              device="${result#UITestResults-}"
              device="${device%.xcresult}"
              xcrun xcresulttool export attachments --path "$result" --output-path "TestAttachments-$device"
            fi
          done
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            SimulatorInventory.txt
            UnitTestResults.xcresult
            UITestResults-iPhone.xcresult
            UITestResults-iPad.xcresult
            TestAttachments-iPhone
            TestAttachments-iPad
          if-no-files-found: ignore
